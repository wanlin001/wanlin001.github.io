{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply the theme before the first paint, so a reader who chose dark mode
     does not get a flash of the light theme. The site does NOT follow the
     phone's / OS dark mode any more: dark is used only when the reader presses
     the sun/moon button in the menu, so the site looks the same on a phone as
     on a laptop. Must stay inline and synchronous, and must not contain "//"
     comments (the compress layout strips newlines). main.min.js picks this up
     as its starting value. -->
<script>(function(){try{if(localStorage.getItem("theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}else{localStorage.setItem("theme","light");}}catch(e){}})();</script>


<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- 分頁上的小圖示（favicon）。圖是 Font Awesome Free 的 earth-asia（CC BY 4.0，
     https://fontawesome.com/license/free），顏色改成網站的綠色。
     要換圖：把新的 SVG 存成 images/favicon.svg，然後重新產生那幾個 PNG：
         magick -background none images/favicon.svg -resize 32x32  images/favicon-32x32.png
         magick -background none images/favicon.svg -resize 192x192 images/favicon-192x192.png
         magick -background none images/favicon.svg -resize 512x512 images/favicon-512x512.png
         magick -background none images/favicon.svg -resize 180x180 images/apple-touch-icon-180x180.png
         magick -background none images/favicon.svg -define icon:auto-resize=16,32,48 images/favicon.ico
     瀏覽器會把舊圖示快取很久，換完記得強制重新整理（Cmd+Shift+R）。 -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- Site-specific styles (edit assets/css/custom.css) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css">

<script async src="https://badge.dimensions.ai/badge.js" charset="utf-8"></script>

<!-- end custom head snippets -->
