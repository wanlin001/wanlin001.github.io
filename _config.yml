# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Wan-Lin Hu"
title_separator          : "-"
name                     : &name "Wan-Lin Hu"
description              : &description "Wan-Lin Hu — postdoctoral fellow in earthquake science, geodynamic modelling and structural geology."   # Update this with a general description of your site, this is the default if not overridden by a page
url: "https://wanlin001.github.io"
#url                      : https://academicpages.github.io # The base hostname & protocol for your site e.g. "https://[your GitHub username].github.io",
                                                           # or if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "wanlin001/wanlin001.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Wan-Lin Hu"
  pronouns         : "she/her"  
  bio              : "Postdoctoral fellow, Institute of Earth Sciences, Academia Sinica. Earthquake science, geodynamic modelling, structural geology."
  location         : "Taipei, Taiwan"
  employer         : "Academia Sinica"
  uri              : # URL
  email            : "huwanlin@earth.sinica.edu.tw"

  # Academic websites
  academia         : # URL
  #arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : "https://scholar.google.com/citations?user=UTmGp2YAAAAJ&hl=zh-TW"
  #inspire-hep      : # URL
  #impactstory      : # URL
  orcid            : "https://orcid.org/0000-0003-3849-5101"
  #semantic         : # URL
  #ssrn             : # URL
  researchgate     : "https://www.researchgate.net/profile/Wan-Lin-Hu-3?ev=hdr_xprf"
  #scopus           : # URL
  zotero           : # URL #https://www.zotero.org/huwanlin/library


  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "wanlin001"
  #kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  artstation       : # Username
  bluesky          : # Replace this with you Bluesky username
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : # Username
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : # Username for X / Twitter
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username

# Publication Category - The following the list of publication categories and their headings
# ═══════════════════════════════════════════════════════════════════════════
#  論文頁的分區  →  https://wanlin001.github.io/publications/
#  這裡的順序 = 頁面上分區的順序。
#
#  新增一個分區：在下面加一組，然後在 _publications/*.md 寫 category: <代號>
#      title: 分區標題（讀者看到的）    label: 卡片上那個小色塊的字
#  想給新分區顏色，在 assets/css/custom.css 加一行：
#      .pub-tag--代號 { background: #16a085; }
#
#  ── 相關的東西在哪 ──
#    彩色標籤的文字和顏色   _data/topics.yml   ← 跟 Notes 頁共用同一個檔
#    哪一篇掛哪些標籤       _publications/*.md 的 topics:
#    Notes 頁的章節分類     _data/notes.yml 的 categories:
#
#  想知道現在有哪些分區、哪些標籤、各被用了幾次：
#      ruby scripts/list_labels.rb
# ═══════════════════════════════════════════════════════════════════════════
publication_category:
  outreach:
    title: '科普寫作 · Public engagement writing'
    label: 'Outreach'
  manuscripts:
    title: 'Peer-reviewed journal articles'
    label: 'Journal paper'
  inprep:
    title: 'In preparation'
    label: 'In prep.'
  conferences:
    title: 'Conference presentations'
    label: 'Conference'

# External blog feeds (Medium, Substack, WordPress, ...)
# Pulled at build time by scripts/fetch_feeds.py into _data/posts.yml and
# rendered on the Resources page. Medium's RSS sends no CORS header and its
# pages refuse to be framed, so fetching in the browser is not an option.
# Uncomment and put your own handle in, then run:  python3 scripts/fetch_feeds.py
external_feeds:
#  - name: Medium
#    url: https://medium.com/feed/@your-handle
#    limit: 6

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : true      # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Social media default site image
og_description           :  # Social media default site image description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics — 訪客統計
# provider 設 "custom" 之後，只要填下面其中一個代號就會開始計算人流。
# 兩個都是無 cookie、不需要同意橫幅，後台只有妳自己看得到。
#   goatcounter_code : 到 goatcounter.com 免費註冊，填網址前面那段（例如 wanlin）
#   cloudflare_token : Cloudflare Web Analytics 給的 token
# 兩個都留空 = 完全不追蹤（現在就是這樣）。
# 本機 jekyll serve 預覽永遠不會被計入。
analytics:
  provider               : "custom" # false, "google", "google-universal", "google-analytics-4", "custom"
  goatcounter_code       :          # 例如 wanlin
  cloudflare_token       :
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  publications:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Etc/UTC # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
