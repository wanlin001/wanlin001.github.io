# ═══════════════════════════════════════════════════════════════════════════
#  NOTES 頁的內容  →  https://wanlin001.github.io/notes/
# ═══════════════════════════════════════════════════════════════════════════
#
#  ┌─ 想改什麼 ──────────────────┬─ 去哪改 ────────────────────────────────┐
#  │ 章節分類（新增/改名/排序）  │ 這個檔案，下面的 categories: 區塊       │
#  │ 每一則筆記                  │ 這個檔案，下面的 notes: 區塊            │
#  │ 標籤的名稱和顏色            │ _data/topics.yml（跟論文共用）          │
#  │ 頁面版型                    │ _pages/notes.html（一般不用碰）         │
#  └─────────────────────────────┴─────────────────────────────────────────┘
#
#  想知道現在有哪些分類、哪些標籤、各被用了幾次：
#      ruby scripts/list_labels.rb
#
#  改完存檔前先驗一下格式（印出 OK 就沒問題）：
#      ruby -ryaml -e 'YAML.load_file("_data/notes.yml"); puts "OK"'
#
# ── 常犯的三個 YAML 錯誤 ──────────────────────────────────────────────────
#   ❌ -title: "x"        ✅ - title: "x"     橫線後面要有空格
#   ❌ url:"https://…"    ✅ url: "https://…"  冒號後面要有空格
#   ❌ category: Other    ✅ category: other   大小寫要跟 categories: 一致
#
#  「categories:」和「notes:」各自整個檔案只能出現一次。
#  加第二則是在 notes: 底下多一組「  - title:」，不是再寫一次 notes:。
#
# ── 每一則的欄位（只有 title 和 url 必填）─────────────────────────────────
#   - title     標題        中文英文都可以，妳自己決定
#     url       連結
#     category  分類代號，填 categories: 裡的 key；沒填就掉到 Other
#     source    來源，例如 HackMD / Medium / Notion
#     date      日期，格式隨意
#     excerpt   一兩句說明
#     image     封面圖網址，或 /images/xxx.jpg
#     topics    標籤，例如 [gear, checklist]。選用，一則一則決定：
#               全部都不寫 → 頁面上方的篩選列整條自動消失
#               只要有一則寫 → 篩選列自動出現，且只列出有被用到的標籤
# ═══════════════════════════════════════════════════════════════════════════

categories:  分區。順序 = 頁面上的顯示順序
#   notes:       每一則筆記
#
# ⚠️ 「categories:」和「notes:」各自整個檔案只能出現一次。
#    加第二則是在 notes: 底下多一組「  - title:」，不是再寫一次 notes:。
#
# 欄位（除了 title 和 url，其他都可以不寫）：
#   - title     標題          ← 必填。中文英文都可以，妳自己決定
#     url       連結          ← 必填
#     category  分區代號，填上面 categories 裡的 key；不填就歸到 Other
#     source    來源，例如 HackMD / Medium / Notion
#     date      日期，格式隨意
#     excerpt   一兩句說明
#     image     封面圖網址，或 /images/xxx.jpg
#     topics    彩色標籤，例如 [gear, checklist]，顏色定義在 _data/topics.yml
#
# 關於 topics：完全是選用的，而且是「一則一則」決定的。
#   · 不寫 → 那則就沒有標籤
#   · 全部都不寫 → 頁面上方的篩選列會整條自動消失
#   · 只有其中幾則寫 → 只有那幾則會顯示標籤，篩選列也只會列出有被用到的
# 現在兩則都沒有用，所以頁面上是乾淨的分區清單。
# ---------------------------------------------------------------------------

categories:

  hiking:
    title: "Hiking"

  fieldwork:
    title: "Fieldwork"

  research:
    title: "Research notes"

  other:
    title: "Other"


