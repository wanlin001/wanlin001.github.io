# ---------------------------------------------------------------------------
# Notes 頁的內容（/notes/，在選單 Others 底下）。
#
# 兩個部分：
#   categories:  分區。順序 = 頁面上的顯示順序
#   notes:       每一則筆記
#
# ⚠️ 「categories:」和「notes:」各自整個檔案只能出現一次。
#    加第二則是在 notes: 底下多一組「  - title:」，不是再寫一次 notes:。
#
# 欄位（除了 title 和 url，其他都可以不寫）：
#   - title     標題          ← 必填
#     url       連結          ← 必填
#     category  分區代號，填上面 categories 裡的 key；不填就歸到 Other
#     source    來源，例如 HackMD / Medium / Notion
#     date      日期，格式隨意
#     excerpt   一兩句說明
#     image     封面圖網址，或 /images/xxx.jpg
#     topics    彩色標籤，例如 [gear, checklist]，顏色定義在 _data/topics.yml
#
# 關於 topics：完全是選用的，而且是「一則一則」決定的。
#   · 不寫 → 那則就沒有標籤
#   · 全部都不寫 → 頁面上方的篩選列會整條自動消失
#   · 只有其中幾則寫 → 只有那幾則會顯示標籤，篩選列也只會列出有被用到的
# 現在兩則都沒有用，所以頁面上是乾淨的分區清單。
# ---------------------------------------------------------------------------

categories:

  hiking:
    title: "Hiking"

  fieldwork:
    title: "Fieldwork"

  research:
    title: "Research notes"

  other:
    title: "Other"


notes:

  - title: "Multi-day hiking gear checklist"
    url: "https://hackmd.io/@HuWanLin/H1qQUcWX1l"
    category: hiking
    source: "HackMD"
    date: "Feb 2024"
    excerpt: "Packing list for trips of two days or more, with tick boxes you can click straight on the page. Written in Mandarin."

  - title: "Day hike gear checklist"
    url: "https://hackmd.io/@HuWanLin/H1TIhHTt-x"
    category: hiking
    source: "HackMD"
    excerpt: "The short version, for single-day trips. Written in Mandarin."

