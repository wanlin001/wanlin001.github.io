# ---------------------------------------------------------------------------
# Notes 頁的內容（/notes/，在選單 Others 底下）。
#
# 兩個部分：
#   categories:  分區。順序 = 頁面上的顯示順序
#   notes:       每一則筆記
#
# ⚠️ 「categories:」和「notes:」各自整個檔案只能出現一次。
#    加第二則是在 notes: 底下多一組「  - title:」，不是再寫一次 notes:。
#
# 欄位（除了 title 和 url，其他都可以不寫）：
#   - title     標題          ← 必填。中文英文都可以，妳自己決定
#     url       連結          ← 必填
#     category  分區代號，填上面 categories 裡的 key；不填就歸到 Other
#     source    來源，例如 HackMD / Medium / Notion
#     date      日期，格式隨意
#     excerpt   一兩句說明
#     image     封面圖網址，或 /images/xxx.jpg
#     topics    彩色標籤，例如 [gear, checklist]，顏色定義在 _data/topics.yml
#
# 關於 topics：完全是選用的，而且是「一則一則」決定的。
#   · 不寫 → 那則就沒有標籤
#   · 全部都不寫 → 頁面上方的篩選列會整條自動消失
#   · 只有其中幾則寫 → 只有那幾則會顯示標籤，篩選列也只會列出有被用到的
# 現在兩則都沒有用，所以頁面上是乾淨的分區清單。
# ---------------------------------------------------------------------------

categories:

  hiking:
    title: "Hiking"

  fieldwork:
    title: "Fieldwork"

  research:
    title: "Research notes"

  other:
    title: "Other"


notes:

  - title: "兩日以上登山裝備清單"
    url: "https://hackmd.io/@HuWanLin/H1qQUcWX1l"
    category: hiking
    source: "HackMD"
    date: "Feb 2024"
    excerpt: "多日行程的打包清單，可以直接在頁面上打勾。從隨身行李、營地裝備到緊急用品，出門前照著掃一遍。"

  - title: "一日登山裝備清單"
    url: "https://hackmd.io/@HuWanLin/H1TIhHTt-x"
    category: hiking
    source: "HackMD"
    excerpt: "單日行程的精簡版。"

  - title: "Commonly used Linux commands"
    url: "https://hackmd.io/@HuWanLin/linux_commands"
    category: research
    source: "HackMD"
    excerpt: "備忘用的 Linux 指令表：目錄操作、檔案增刪搬移、文字擷取與 awk、壓縮、SSH 與 HPC 上常用的幾組指令。"

  - title: "Seismic Phase Picker & Record Viewer"
    url: "https://hackmd.io/@HuWanLin/r1Zfo5OL-l"
    category: research
    date: "Jan 2026"
    source: "HackMD"
    excerpt: "自己寫的互動式 SAC 波形檢視與到時挑選工具的使用說明：可獨立標記多個震相、bandpass 濾波、STA/LTA、包絡線、排序與縮放，針對大型測網資料設計。"

