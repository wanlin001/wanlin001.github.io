# ---------------------------------------------------------------------------
# Notes 頁的內容（網址 /notes/，在選單的 Others 底下）。
#
# 這個檔案有兩個部分：
#   categories:  分區，順序就是頁面上的顯示順序
#   notes:       每一則筆記
#
# ⚠️ 「categories:」和「notes:」各自整個檔案只能出現一次。
#    要加第二則筆記，是在 notes: 底下多一組「  - title:」，
#    不是再寫一次 notes:（YAML 遇到重複的 key 會蓋掉前面的）。
#
# 每一則的欄位：
#   - title     標題（必填）
#     url       連結（必填）
#     category  屬於哪一個分區，填上面 categories 的代號；沒填就歸到「其他」
#     topics    主題標籤，可以多個，顏色定義在 _data/topics.yml
#     source    來源標籤，例如 HackMD / Medium / Notion
#     date      日期，格式隨意，可省略
#     excerpt   一兩句說明，可省略
#     image     封面圖網址或 /images/xxx.jpg，可省略
# ---------------------------------------------------------------------------

categories:

  hiking:
    title: "登山 · Hiking"
    label: "登山"

  fieldwork:
    title: "野外工作 · Fieldwork"
    label: "野外"

  research:
    title: "研究與工具 · Research notes"
    label: "研究"

  other:
    title: "其他 · Other"
    label: "其他"


notes:

  - title: "兩日以上登山裝備清單"
    url: "https://hackmd.io/@HuWanLin/H1qQUcWX1l"
    category: hiking
    topics: [gear, checklist]
    source: "HackMD"
    date: "26 Feb 2024"
    excerpt: "多日行程的打包清單，可以直接在頁面上打勾。從隨身行李、營地裝備到緊急用品，出門前照著掃一遍。"

  - title: "一日登山裝備清單"
    url: "https://hackmd.io/@HuWanLin/H1TIhHTt-x"
    category: hiking
    topics: [gear, checklist]
    source: "HackMD"

