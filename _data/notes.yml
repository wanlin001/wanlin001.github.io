# ---------------------------------------------------------------------------
# 筆記／文章清單，顯示在 Resources 頁的「Notes & writing」。
# HackMD、Medium、Notion、任何有網址的東西都可以放。
#
# ⚠️ 最重要的一條規則：
#     「notes:」這個字整個檔案只能出現一次，寫在最上面。
#     要加第二、第三則，是在它底下多加一組「  - title:」，
#     不是再寫一次「notes:」。（YAML 遇到重複的 key 會直接蓋掉前面的，
#     所以寫兩次 notes: 只會剩最後一則。）
#
# 每一則的欄位（縮排要對齊，用空格不要用 Tab）：
#   - title    標題（必填）
#     url      連結（必填）
#     source   來源標籤，例如 HackMD / Medium / Notion
#     date     日期，格式隨意，可省略
#     excerpt  一兩句說明，可省略
#     image    封面圖網址或 /images/xxx.jpg，可省略
#
# 刪掉一整組「- title: ...」就會從網頁上消失。
# ---------------------------------------------------------------------------

notes:
  - title: "兩日以上登山裝備清單"
    url: "https://hackmd.io/@HuWanLin/H1qQUcWX1l"
    source: "HackMD"
    date: "26 Feb 2024"
    excerpt: "多日行程的打包清單，可以直接在頁面上打勾。從隨身行李、營地裝備到緊急用品，出門前照著掃一遍。"
  - title: "一日登山裝備清單"
    url: "https://hackmd.io/@HuWanLin/H1TIhHTt-x"
    source: "HackMD"

