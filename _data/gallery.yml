# ═══════════════════════════════════════════════════════════════════════════
#  照片牆的說明文字  →  https://wanlin001.github.io/photos/
# ═══════════════════════════════════════════════════════════════════════════
#
#  ┌─ 想改什麼 ──────────────────┬─ 去哪改 ────────────────────────────────┐
#  │ 加一張照片                  │ 直接把檔案丟進 images/gallery/          │
#  │ 照片的說明（滑過去才出現）  │ 這個檔案，下面的 captions:              │
#  │ 排序、版面                  │ _pages/photos.html（一般不用碰）        │
#  └─────────────────────────────┴─────────────────────────────────────────┘
#
#  ── 加照片 ──────────────────────────────────────────────────────────────
#  把檔案丟進 images/gallery/ 就會自動出現在照片牆上，不用登記在這裡。
#  images/travel/ 底下的照片也會一起出現。
#
#  縮圖指令（放上去前先跑，不然網頁會很慢）：
#      sips -Z 1600 -s format jpeg -s formatOptions 55 images/gallery/*.jpg
#
#  ── 說明文字 ────────────────────────────────────────────────────────────
#  完全是選用的。想幫某張加說明，就在下面寫一行：
#
#      檔名.jpg: "說明文字"
#
#  只用檔名，不用寫資料夾。沒寫的照片就沒有說明，滑鼠移過去不會有東西跳出來。
#  ⚠️ 檔名有空格或特殊字元時要用引號包起來："my photo.jpg": "說明"
# ═══════════════════════════════════════════════════════════════════════════

captions:

