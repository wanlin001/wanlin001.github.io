# ═══════════════════════════════════════════════════════════════════════════
#  照片牆的說明文字  →  https://wanlin001.github.io/photos/
# ═══════════════════════════════════════════════════════════════════════════
#
#  ┌─ 想改什麼 ──────────────────┬─ 去哪改 ────────────────────────────────┐
#  │ 加一張照片                  │ 直接把檔案丟進 images/gallery/          │
#  │ 照片的說明（滑過去才出現）  │ 日期是自動的；想多寫一句才改這個檔      │
#  │ 排序、版面                  │ _pages/photos.html（一般不用碰）        │
#  └─────────────────────────────┴─────────────────────────────────────────┘
#
#  ── 加照片 ──────────────────────────────────────────────────────────────
#  把檔案丟進 images/gallery/ 就會自動出現在照片牆上，不用登記在這裡。
#  images/travel/ 底下的照片也會一起出現。
#
#  縮圖指令（放上去前先跑，不然網頁會很慢）：
#      sips -Z 1600 -s format jpeg -s formatOptions 55 images/gallery/*.jpg
#
#  ── 說明文字：日期是自動的 ──────────────────────────────────────────────
#  預設的說明就是「拍攝日期」，直接從檔名讀出來 —— 檔名開頭是 YYYYMMDD 就會
#  自動變成「8 Nov 2022」。手機拍的照片本來就長這樣，所以什麼都不用做。
#
#  想幫某張再加一句話，在下面寫一行，會接在日期後面顯示：
#
#      檔名.jpg: "說明文字"      →   8 Nov 2022 · 說明文字
#
#  只用檔名，不用寫資料夾。沒寫的照片就只顯示日期。
#  檔名開頭不是日期、又沒寫說明的照片，滑過去不會有任何文字 ——
#  所以檔名保持 YYYYMMDD_ 開頭最省事：日期自動有了，排序也自動對。
#  ⚠️ 檔名有空格或特殊字元時要用引號包起來："my photo.jpg": "說明"
# ═══════════════════════════════════════════════════════════════════════════

