# ═══════════════════════════════════════════════════════════════════════════
#  首頁的「News」與「Guides」  →  https://wanlin001.github.io/
# ═══════════════════════════════════════════════════════════════════════════
#
#  ┌─ 想改什麼 ──────────────────┬─ 去哪改 ────────────────────────────────┐
#  │ News 一則消息               │ 這個檔案，下面的 news:                  │
#  │ Guides 一個頁面介紹         │ 這個檔案，下面的 guides:                │
#  │ 首頁最上面那幾段自我介紹    │ _pages/about.md                         │
#  │ 版面                        │ _pages/about.md 的 Liquid 迴圈（不用碰）│
#  └─────────────────────────────┴─────────────────────────────────────────┘
#
#  ⚠️ 「news:」和「guides:」各自整個檔案只能出現一次。
#     加第二則是在底下多一組「  - title:」，不是再寫一次 news:。
#
#  ── 欄位（只有 title 必填）─────────────────────────────────────────────
#     - title    標題                    ← 必填。中文英文都可以
#       date     日期，格式隨意，可省略。News 建議寫，Guides 通常不用
#       url      點下去要去哪。站內寫 /research/，站外寫 https://…
#       excerpt  一兩句說明
#       image    小圖，例如 /images/gallery/20221108_144202.jpg
#                或外部網址。不寫就沒有圖，版面會自己補齊
#
#  刪掉一整組「- title: ...」就會從首頁消失。
#  news: 底下留空（寫成 news: []）整個 News 區塊會自動隱藏，guides: 也一樣。
#
#  改完記得驗一下格式：
#      ruby -ryaml -e 'YAML.load_file("_data/home.yml"); puts "OK"'
# ═══════════════════════════════════════════════════════════════════════════

news:

  - date: "Jun 2026"
    title: "Postdoctoral Paper Award, NSTC Taiwan"
    excerpt: "國科會地球科學研究推動中心博士後研究論文獎。"
    url: /cv/#awards--funding

  - date: "May 2026"
    title: "Fieldwork at the Vajont Dam, Italy"
    excerpt: "為《地質》季刊的稿件走訪 Monte Toc 滑動面與 Longarone。"
    url: /travel/#vajont-dam
    image: /images/travel/vajont/20260516_152714_monte-toc.jpg

  - date: "Apr 2026"
    title: "EGU 2026 — slab–slab interaction beneath Taiwan"
    excerpt: "在維也納報告 Manila–Taiwan–Ryukyu 雙隱沒系統的地動力模擬與地震異向性。"
    url: /publications/#inprep

  - date: "2026"
    title: "New paper in Tectonophysics"
    excerpt: "以熱力學-力學有限元素模型拆解台灣西南泥岩帶地表變形的構造與岩性控制。"
    url: /publications/#manuscripts

  - date: "2025"
    title: "New paper in Communications Earth & Environment"
    excerpt: "2006 年恆春外海地震對揭示減薄大陸岩石圈地函仍能孕育地震。"
    url: /publications/#manuscripts


guides:

  - title: "Research"
    url: /research/
    excerpt: "目前在做的四條線：台灣底下的板塊交互作用與地函流動、大陸岩石圈地函的強度、地表變形的構造與岩性控制、以及斷層弱化與非均質性。附常用的方法與工具。"

  - title: "Publications"
    url: /publications/
    excerpt: "期刊論文、準備中的稿件與中文科普寫作。每一篇都有 DOI、PDF 或程式碼連結；點彩色標籤可以只看同一個領域的。"

  - title: "CV"
    url: /cv/
    excerpt: "學經歷、獎項、指導過的學生、教學、審稿與科普活動、技術能力。"

  - title: "Fieldwork"
    url: /fieldwork/
    excerpt: "野外工作的地圖與紀錄 —— 尼泊爾喜馬拉雅、蘇門答臘、台灣，以及規劃中的挪威 Western Gneiss Region。"

  - title: "Travel"
    url: /travel/
    excerpt: "旅行與山行，照片和地圖為主。"

  - title: "Photos"
    url: /photos/
    excerpt: "所有照片攤在一頁上，滑鼠移過去顯示日期，點下去看大圖。"

  - title: "Notes"
    url: /notes/
    excerpt: "寫給自己的工作筆記與檢查表：Linux 與 SAC 指令、Git 多機協作、Perple_X 查找表、地震相位挑選工具，還有登山裝備清單。"

  - title: "Resources"
    url: /resources/
    excerpt: "論文用到的程式與資料、常用軟體連結，以及給學生的資源。"
