# ---------------------------------------------------------------------------
# Research-field tags shown on the publications page.
#
# HOW TO ADD A TAG
#   1. add a block below:            my-key:
#                                      label: "Display name"   <- 一律用英文
#                                      color: "#2e9e6b"
#   2. use it in a publication file: topics: [my-key, another-key]
#
# The key is what you type in the front matter; the label is what readers see.
# Any hex colour works. Delete a block to remove the tag everywhere.
# ---------------------------------------------------------------------------

geodynamics:
